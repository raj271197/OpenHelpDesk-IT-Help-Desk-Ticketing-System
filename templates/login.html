{% extends 'base.html' %}
{% block title %}Login - OpenHelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
  <div class="col-md-5">
    <div class="auth-form card">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <h2 class="mb-2">Welcome Back</h2>
          <p class="text-muted">Sign in to your OpenHelpDesk account.</p>
        </div>
        <form method="POST" action="{{ url_for('auth.login') }}" class="mb-3">
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" placeholder="••••••••" required>
          </div>
          <button class="btn btn-primary w-100">Sign In</button>
        </form>
        <div class="position-relative text-center my-4">
          <span class="small text-muted px-3" style="background: rgba(255,255,255,0.9);">Or continue with OTP</span>
          <div style="position:absolute; inset: 50% 0 0; border-top: 1px solid rgba(148,163,184,0.25); transform: translateY(-50%);"></div>
        </div>
        <form method="POST" action="{{ url_for('auth.send_otp') }}">
          <div class="input-group mb-4">
            <input type="email" name="email" class="form-control" placeholder="Enter your email" required>
            <button class="btn btn-outline-secondary" type="submit">Get OTP</button>
          </div>
        </form>
        <p class="text-center text-muted small">Need an account? <a href="{{ url_for('auth.signup') }}" class="text-decoration-none" style="color: var(--primary);">Sign up</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
