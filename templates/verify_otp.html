{% extends 'base.html' %}
{% block title %}Verify OTP - OpenHelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: calc(100vh - 140px);">
  <div class="col-md-5">
    <div class="auth-form card">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <h2 class="mb-2">Verify OTP</h2>
          <p class="text-muted">Enter the 6-digit code sent to your email.</p>
        </div>
        <form method="POST" action="{{ url_for('auth.verify_otp') }}">
          <div class="mb-4">
            <label class="form-label">One-Time Password</label>
            <input type="text" name="otp" class="form-control form-control-lg text-center" maxlength="6" placeholder="000000" required>
          </div>
          <button class="btn btn-primary w-100">Verify OTP</button>
        </form>
        <p class="mt-4 text-center text-muted small">Need help? Go back to <a href="{{ url_for('auth.login') }}" class="text-decoration-none" style="color: var(--primary);">login</a>.</p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
