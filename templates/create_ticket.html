{% extends 'base.html' %}
{% block title %}Create Ticket - OpenHelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8 col-lg-10">
    <div class="card p-5">
      <div class="d-flex justify-content-between flex-column flex-md-row align-items-start align-items-md-center mb-4 gap-3">
        <div>
          <h3 class="mb-2">Create a new ticket</h3>
          <p class="text-muted mb-0">Share the issue details so our support team can respond quickly.</p>
        </div>
      </div>
      <form method="POST">
        <div class="mb-4">
          <label class="form-label">Title</label>
          <input type="text" name="title" class="form-control" placeholder="E.g. Printer not responding" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="6" placeholder="Describe the problem and any error messages." required></textarea>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
              <option value="Software">Software</option>
              <option value="Hardware">Hardware</option>
              <option value="Network">Network</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-select" required>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <input type="text" class="form-control" value="Open" disabled>
          </div>
        </div>
        <button class="btn btn-primary btn-lg">Submit Ticket</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
