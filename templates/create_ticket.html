{% extends 'base.html' %}
{% block title %}Create Ticket - OpenHelpDesk{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-xl-8 col-lg-10">
    <div class="card p-5">
      <div class="d-flex justify-content-between flex-column flex-md-row align-items-start align-items-md-center mb-4 gap-3">
        <div>
          <h3 class="mb-2">Create a new ticket</h3>
          <p class="text-muted mb-0">Share the issue details so our support team can respond quickly.</p>
        </div>
        <a href="{{ url_for('ticket.dashboard') }}" class="btn btn-outline-secondary">Back to Dashboard</a>
      </div>
      <form method="POST">
        {{ csrf_field() }}
        <div class="mb-4">
          <label class="form-label">Title</label>
          <input type="text" name="title" class="form-control" placeholder="E.g. Printer not responding" value="{{ form_data.title }}" required>
        </div>
        <div class="mb-4">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-control" rows="6" placeholder="Describe the problem and any error messages." required>{{ form_data.description }}</textarea>
        </div>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">Category</label>
            <select name="category" class="form-select" required>
              {% for category in ticket_categories %}
                <option value="{{ category }}" {% if form_data.category == category %}selected{% endif %}>{{ category }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Priority</label>
            <select name="priority" class="form-select" required>
              {% for priority in ticket_priorities %}
                <option value="{{ priority }}" {% if form_data.priority == priority %}selected{% endif %}>{{ priority }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Status</label>
            <input type="text" class="form-control" value="Open" disabled>
          </div>
        </div>
        <button class="btn btn-primary btn-lg">Submit Ticket</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
