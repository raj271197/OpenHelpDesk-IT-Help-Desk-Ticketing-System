services:
  - type: web
    name: openhelpdesk
    runtime: python
    plan: starter
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: openhelpdesk-db
          property: connectionString

databases:
  - name: openhelpdesk-db
    plan: basic-256mb
    region: ohio
    databaseName: openhelpdesk
    user: openhelpdesk
